<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain · Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1113;--s1:#171A1D;--s2:#20242A;--line:#2B3036;--tx:#ECEEF0;--mu:#9AA3AE;--ac:#5EE6C3;--aci:#0B1513;--acs:rgba(94,230,195,.10);--good:#4CC38A;--warn:#F0A63A;--bad:#F2555A;--wns:rgba(240,166,58,.10)}
[data-theme=paper]{--bg:#F3F0E8;--s1:#FFF;--s2:#F6F3EC;--line:#E2DDD1;--tx:#1C1B19;--mu:#5C584F;--ac:#3E4FD8;--aci:#FFF;--acs:rgba(62,79,216,.08);--good:#1E7F52;--warn:#A35F07;--bad:#C2302C;--wns:rgba(163,95,7,.08)}
[data-theme=midnight]{--bg:#0A0F1E;--s1:#111832;--s2:#18213F;--line:#253055;--tx:#E8ECF6;--mu:#9AA6C4;--ac:#F4B740;--aci:#1A1405;--acs:rgba(244,183,64,.11);--good:#5FD39A;--warn:#FF9F5A;--bad:#FF6B6B;--wns:rgba(255,159,90,.10)}
[data-theme=arctic]{--bg:#EEF2F7;--s1:#FFF;--s2:#F4F7FB;--line:#DBE2EC;--tx:#0F172A;--mu:#4D5B71;--ac:#2563EB;--aci:#FFF;--acs:rgba(37,99,235,.07);--good:#15803D;--warn:#B45309;--bad:#C81E1E;--wns:rgba(180,83,9,.07)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden}body{position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:26px 32px 22px;display:flex;flex-direction:column;gap:18px}
.h{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.3px}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}.wn{color:var(--warn)}.bd{color:var(--bad)}.gd{color:var(--good)}.ac{color:var(--ac)}
.card{background:var(--s1);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.grow{flex:1;min-width:0;min-height:0}
.pill{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--s2);white-space:nowrap}
.btn{padding:8px 13px;border-radius:10px;font-size:13.5px;font-weight:700;background:var(--ac);color:var(--aci);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--mu);font-weight:600}
.btn.sm{padding:6px 10px;font-size:12.5px}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
header{display:flex;align-items:center;gap:22px;height:58px;flex:none}
nav{margin-left:auto;display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--s1)}
nav a{padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu)}
nav a.on{background:var(--ac);color:var(--aci);font-weight:700}
main{flex:1;min-height:0;display:grid;gap:18px}
footer{flex:none;display:flex;gap:18px;align-items:center;font-size:13px;color:var(--mu);height:22px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--good);display:inline-block}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--s2)}
.tick{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .25s}
.tick.on{background:var(--ac);border-color:var(--ac);animation:pop .45s ease-out}
.tick svg{opacity:0}.tick.on svg{opacity:1}
.done-txt{text-decoration:line-through;color:var(--mu)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s ease-out both}
.ring circle.v{animation:ringfill 1.2s ease-out}
.tl{position:relative;display:flex;flex-direction:column;gap:2px}
.ev{display:flex;gap:12px;padding:8px 10px;border-radius:10px;font-size:14px}
.ev.now{background:var(--acs)}.ev.past{opacity:.45}.ev.clash .t{color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.night #stage{filter:brightness(.55)}
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#setup .card{width:560px;gap:14px}
#setup input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx)}
.empty{font-size:13.5px;color:var(--mu);line-height:1.45}
.toast{position:fixed;right:28px;bottom:28px;padding:12px 16px;border-radius:12px;background:var(--s2);font-size:14px;animation:rise .3s}
.wk{display:grid;grid-template-columns:52px repeat(7,1fr);gap:0 6px;position:relative}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.25;overflow:hidden;background:var(--s2);border-left:3px solid var(--mu)}
.blk.clash{border-left-color:var(--warn);background:var(--wns)}
.blk.class{border-left-color:var(--line)}
.blk.due{background:var(--acs);border-left-color:var(--ac)}
#phone{padding:56px 16px 28px;display:flex;flex-direction:column;gap:14px;font-size:15px;overflow:auto;height:auto}
#phone .card{padding:16px;gap:10px;border-radius:16px}
body.narrow{overflow:auto}body.narrow #stage{display:none}body.narrow #phone{display:flex!important}
</style>
</head>
<body>
<div id="status" style="position:fixed;left:0;right:0;top:0;padding:10px 14px;font:14px Inter,system-ui,sans-serif;color:#9AA3AE;background:#0F1113;z-index:9">Loading your second brain…</div>
<div id="stage"></div>
<div id="phone" style="display:none"></div>
<script src="app.js"></script>
</body>
</html>
