<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}
/* Diary: a month strip on the left, entries as pages on the right. His words stand out as quotes. */
.dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dhead .spacer { flex: 1; }
.dsearch { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px; padding: 6px 12px; width: min(260px, 100%); }
.dmonth { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dmonth .dow { font-size: 11px; color: var(--ink-4); text-align: center; padding-bottom: 2px; }
.dmonth .dd { aspect-ratio: 1; border-radius: 8px; border: 0; background: transparent; color: var(--ink-4); font: 500 12.5px var(--f-mono); display: flex; align-items: center; justify-content: center; position: relative; }
.dmonth .dd.has { background: var(--accent-soft); color: var(--accent-ink); cursor: pointer; }
.dmonth .dd.has:hover { outline: 1px solid var(--accent); }
.dmonth .dd.wait::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
.dmonth .dd.today { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.dentry { scroll-margin-top: 90px; }
.dentry .dtop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.dentry .dday { font: 600 19px var(--f-head); letter-spacing: -0.01em; }
.dentry .mood { font-size: 12.5px; color: var(--ink-2); background: var(--sunk); border-radius: 999px; padding: 2px 10px; }
.dbody { max-width: 68ch; line-height: 1.62; color: var(--ink); }
.dbody p { margin: 0 0 10px; }
.dquote { margin: 12px 0 4px; padding: 2px 0 2px 14px; border-left: 2px solid var(--accent); color: var(--ink-2); font-style: italic; max-width: 64ch; }
.dlinks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.dfoot { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.dfoot .spacer { flex: 1; }
.dedit textarea { box-sizing: border-box; width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 12px 14px; font: 15px/1.6 var(--f-body); resize: vertical; }
.dedit input { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); padding: 6px 10px; width: min(320px, 100%); }
.dedit .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* Mirror: a monthly review that reads like a boss with all the data. One verdict per box, evidence under it,
   his own words quoted back, then the decision for that box. Colour only for verdicts. */
.verdict.fail { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.mhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mhead .spacer { flex: 1; }
.mline { font: 600 21px/1.35 var(--f-head); letter-spacing: -0.01em; max-width: 60ch; text-wrap: balance; margin: 0; }
.mbx { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px; }
@media (max-width: 900px) { .mbx { grid-template-columns: minmax(0, 1fr); } }
.mbx .ev { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; color: var(--ink-2); }
.mbx .ev li::before { content: "·"; color: var(--ink-4); margin-right: 8px; }
.mbx .qs { margin: 0 0 8px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.mbx textarea, .mform input, .mform select, .mrw input { box-sizing: border-box; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 9px 12px; font: 14px/1.5 var(--f-body); }
.mbx textarea { min-height: 84px; resize: vertical; }
.mdec { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.mrw { margin-top: 8px; }
.saved { font-size: 12px; color: var(--good); }
.mform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 700px) { .mform { grid-template-columns: minmax(0, 1fr); } }
.mlist .lrow b { font-weight: 500; }
.mtag { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-3); }
.mtag.dropped, .mtag.overdue { color: var(--bad); }
.mtag.late { color: var(--warn); }
.mclose { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Control room: one band that changes with the time of day, the outbox with what to do about each item,
   a night clock for the always-on monitor, and a side sheet that answers "why is this here?". */
.modeband { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-radius: 14px; padding: 12px 18px; background: var(--sunk); }
.modeband .mk { font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.modeband .mt { font: 600 16px var(--f-head); flex: 1; min-width: 220px; }
.modeband.done { background: var(--good-soft); }
.modeband.done .mt { color: var(--good); }
.modeband.morning { background: var(--accent-soft); }
.task .why { font: 600 12px var(--f-mono); color: var(--ink-4); }
.task .why:hover { color: var(--accent); }
.yes .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.yes .acts .btn { padding: 4px 10px; font-size: 12.5px; }
.yes .draft { white-space: pre-wrap; font-size: 12.5px; background: var(--panel); border: 1px solid var(--warn-line); border-radius: 10px; padding: 8px 10px; margin-top: 6px; max-height: 160px; overflow: auto; }
.nightclock { position: fixed; inset: 0; z-index: 60; background: #05060A; color: #C9CCD6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 0; width: 100%; cursor: pointer; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
.nightclock .t { font: 500 clamp(72px, 16vw, 220px)/1 var(--f-mono); letter-spacing: -0.04em; color: #9AA0B0; }
.nightclock .d { font-size: 18px; color: #6E7383; }
.nightclock .n { font-size: 15px; color: #8A8FA0; max-width: 60ch; text-align: center; }
.nightclock .h2 { font-size: 12.5px; color: #4C5060; margin-top: 18px; }
.whysheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 50; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.18); overflow: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 24px 22px; display: flex; flex-direction: column; gap: 14px; }
.whysheet .x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; }
.whysheet .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.whysheet .src { white-space: pre-wrap; font-size: 13px; line-height: 1.55; background: var(--sunk); border-radius: 10px; padding: 10px 12px; max-height: 320px; overflow: auto; }
.whysheet .hist div { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line2); }
</style>
<title>Brain Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
// Theme before first paint: 'auto' follows the system; the space theme is the dark one.
(function () { var p = 'auto'; try { p = localStorage.getItem('desk_theme') || 'auto'; } catch (e) {}
  var dark = p === 'dark' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.dataset.pref = p; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
/* Desk. Light: warm paper. Dark: deep space, glass panels, nebula light. The constellation is always night. */
:root {
  color-scheme: light;
  --bg: #F5F4F0; --panel: #FFFFFF; --sunk: #EFEDE7; --line: #E6E3DC; --line2: #EFEDE7;
  --ink: #17181C; --ink-2: #4B4D55; --ink-3: #6E7079; --ink-4: #A9ABB3;
  --accent: #3346D3; --accent-ink: #2433A8; --accent-soft: #ECEEFC;
  --warn: #9A5B00; --warn-soft: #FBF3E6; --warn-line: #EEDDC2; --bad: #B3261E; --good: #1F7A4A; --good-soft: #E3F3EA;
  --hero-bg: #17181C; --hero-line: transparent; --hero-ink: #F5F4F0; --hero-2: #A9ABB3; --now: #C2410C;
  --cls: #ECEAE4; --evt-bg: #17181C; --evt-ink: #F5F4F0; --evt-line: transparent;
  --tab-on-bg: #17181C; --tab-on-ink: #F5F4F0; --blur: none;
  --b-career: #3346D3; --b-wealth: #8A6B12; --b-social: #B4446C; --b-party: #6B46C1; --b-unique: #0F7C8C; --b-body: #C2540A; --b-together: #4A5A6E; --b-impact: #1F7A4A;
  --f-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "Space Grotesk", Inter, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070A14; --panel: rgba(16,21,40,.78); --sunk: rgba(143,160,255,.07); --line: rgba(143,160,255,.15); --line2: rgba(143,160,255,.08);
  --ink: #E8EBF7; --ink-2: #B4BAD0; --ink-3: #8C94AE; --ink-4: #5C6480;
  --accent: #8FA0FF; --accent-ink: #C3CCFF; --accent-soft: rgba(143,160,255,.15);
  --warn: #F0B155; --warn-soft: rgba(240,177,85,.10); --warn-line: rgba(240,177,85,.22); --bad: #FF8A80; --good: #5FCF92; --good-soft: rgba(95,207,146,.13);
  --hero-bg: radial-gradient(circle at 88% 12%, rgba(143,160,255,.38), transparent 46%), radial-gradient(circle at 10% 100%, rgba(177,151,252,.25), transparent 50%), linear-gradient(135deg, #172052, #0E1230 55%, #1C1238);
  --hero-line: rgba(143,160,255,.28); --hero-ink: #F3F5FF; --hero-2: #A9B2D6; --now: #FF8A5C;
  --cls: rgba(255,255,255,.07); --evt-bg: rgba(143,160,255,.20); --evt-ink: #EEF0FF; --evt-line: rgba(143,160,255,.40);
  --tab-on-bg: rgba(143,160,255,.18); --tab-on-ink: #DDE2FF; --blur: blur(10px);
  --b-career: #8FA0FF; --b-wealth: #D9B44A; --b-social: #EC7FA4; --b-party: #B197FC; --b-unique: #4FC3D4; --b-body: #F59F5A; --b-together: #9FB0C6; --b-impact: #5FCF92;
}

html, body { height: 100%; }
body { background-color: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); display: flex; flex-direction: column; }
:root[data-theme="dark"] body { background-image: radial-gradient(ellipse 70% 55% at 78% -12%, rgba(88,108,255,.22), transparent 62%), radial-gradient(ellipse 55% 45% at -5% 105%, rgba(170,90,255,.14), transparent 60%), var(--stars, none); background-attachment: fixed; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.spacer { flex: 1; }

/* Shell */
header.bar { flex: none; display: flex; align-items: center; gap: 22px; padding-block: 12px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); flex-wrap: wrap; backdrop-filter: var(--blur); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand b { font: 600 18px var(--f-head); letter-spacing: -0.02em; }
.brand .day { color: var(--ink-3); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a { color: var(--ink-2); padding: 6px 13px; border-radius: 999px; font-weight: 500; }
nav.tabs a:hover { background: var(--sunk); }
nav.tabs a[aria-current="page"] { background: var(--tab-on-bg); color: var(--tab-on-ink); }
.sync { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12.5px; border: 1px solid var(--line); background: transparent; padding: 5px 11px; border-radius: 999px; }
.sync:hover { border-color: var(--ink-4); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; box-shadow: 0 0 8px currentColor; color: var(--good); }
.dot.warn { background: var(--warn); color: var(--warn); } .dot.bad { background: var(--bad); color: var(--bad); }
.iconbtn { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 5px 11px; color: var(--ink-2); }
.iconbtn:hover { border-color: var(--ink-4); color: var(--ink); }
main { flex: 1; min-height: 0; overflow: auto; }
.page { max-width: 1380px; margin: 0 auto; padding: 26px max(28px, env(safe-area-inset-right, 0px)) 48px max(28px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 20px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; min-width: 0; backdrop-filter: var(--blur); }
.chead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.h { margin: 0; font: 600 18px var(--f-head); letter-spacing: -0.01em; }
.h.sm { font-size: 15.5px; }
.h1 { margin: 0; font: 600 26px var(--f-head); letter-spacing: -0.02em; }
.sub { color: var(--ink-3); font-size: 13px; }
.kicker { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.row2 { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.grow { flex: 999 1 560px; min-width: 0; }
.rail { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.empty { color: var(--ink-3); padding: 6px 0; }
.notice { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 20px 22px; max-width: 640px; margin: 40px auto; }
.notice b { display: block; margin-bottom: 4px; font-family: var(--f-head); font-size: 16px; }
.swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--ink-4); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0A0D1C; }
.btn.danger { color: var(--bad); }
.linkbtn { border: 0; background: transparent; color: var(--accent); padding: 0; font-weight: 500; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--sunk); }
.seg button { border: 0; border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 500; background: transparent; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: rgba(143,160,255,.2); }
.seg .num { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--tab-on-bg); border-color: transparent; color: var(--tab-on-ink); }
.chip .num { opacity: .65; }
.meter { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 3px; transition: width .6s ease; }
:root[data-theme="dark"] .meter i { box-shadow: 0 0 10px currentColor; }
.lrow { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); align-items: baseline; }
.lrow:last-child { border-bottom: 0; }
.lrow.click { width: 100%; border-left: 0; border-right: 0; border-top: 0; background: transparent; text-align: left; }
.lrow.click:hover b { color: var(--accent); }
.flag { color: var(--warn); font-weight: 500; }

/* Today */
.goalband { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.goalband .g { font: 600 19px var(--f-head); letter-spacing: -0.01em; }
.top { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.hero { background: var(--hero-bg); border: 1px solid var(--hero-line); color: var(--hero-ink); border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 200px; }
.hero .lab { font-size: 12.5px; color: var(--hero-2); font-weight: 500; }
.hero .what { font: 600 32px/1.1 var(--f-head); letter-spacing: -0.02em; text-wrap: balance; }
.hero .when { font-family: var(--f-mono); font-size: 14px; color: var(--hero-2); margin-top: 6px; }
.hero .then { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--hero-2); margin-top: auto; }
.hero .then b { color: var(--hero-ink); font-weight: 500; }
.hero .rolled { font-size: 12.5px; background: rgba(255,255,255,.1); border-radius: 8px; padding: 4px 10px; align-self: flex-start; }
.b3row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line2); }
.b3row:last-of-type { border-bottom: 0; }
.b3row .rank { font: 500 20px var(--f-mono); color: var(--accent); width: 18px; }
.b3row .txt { flex: 1; font-size: 15.5px; font-weight: 500; min-width: 0; }
.b3row.done .rank, .b3row.done .txt { color: var(--ink-4); }
.b3row.done .txt { text-decoration: line-through; font-weight: 400; }
.daydone { color: var(--good); font-weight: 600; padding-top: 8px; }
.pickhint { color: var(--ink-2); background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.tick { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--ink-4); background: transparent; padding: 0; display: grid; place-items: center; flex: none; }
.tick:hover { border-color: var(--good); }
.tick svg { width: 12px; height: 12px; opacity: 0; }
.tick.on { background: var(--good); border-color: var(--good); }
.tick.on svg { opacity: 1; }
.tick.dropped { border-style: dashed; }
.xbtn { border: 0; background: transparent; color: var(--ink-4); font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
.xbtn:hover { color: var(--bad); background: var(--sunk); }

.tl { position: relative; min-width: 720px; }
.tl .track { position: absolute; left: 0; right: 0; top: 22px; bottom: 6px; border-radius: 10px; background: var(--sunk); }
.tl .hr { position: absolute; top: 0; font: 11px var(--f-mono); color: var(--ink-3); transform: translateX(-50%); }
.tl .it { position: absolute; border-radius: 8px; padding: 5px 8px; box-sizing: border-box; overflow: hidden; font-size: 12px; line-height: 1.3; }
.tl .it b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .it span { font: 10.5px var(--f-mono); white-space: nowrap; opacity: .75; }
.it.evt { background: var(--evt-bg); color: var(--evt-ink); border: 1px solid var(--evt-line); }
.it.cls { background: var(--cls); color: var(--ink-2); }
.it.blk { background: var(--accent-soft); color: var(--accent-ink); border: 1.5px dashed var(--accent); }
.it.past { opacity: .42; }
.it.noend { border: 1.5px dashed var(--ink-4); }
.tl .nowl { position: absolute; top: 14px; bottom: 0; width: 2px; background: var(--now); border-radius: 1px; z-index: 2; box-shadow: 0 0 8px var(--now); }
.tl .nowt { position: absolute; bottom: -16px; transform: translateX(-50%); font: 500 10.5px var(--f-mono); color: var(--now); }
.scrollx { overflow-x: auto; }

.task { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line2); }
.task:last-child { border-bottom: 0; }
.task .body { flex: 1; min-width: 0; }
.task .t { overflow: hidden; text-overflow: ellipsis; }
.task.done .t, .task.dropped .t { text-decoration: line-through; color: var(--ink-4); }
.task .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.task .meta .swatch { width: 6px; height: 6px; }
.task .when { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.task .when.late { color: var(--warn); font-weight: 500; }

  const ui = S.ui; const all = c.tasks;
  const byB = { now: [], later: [], unfiled: [] }; all.forEach(t => byB[bucketOf(t)].push(t));
  const pursuits = new Map(); all.filter(t => !isUnfiled(t)).forEach(t => { const k = pursuitOf(t); pursuits.set(k, (pursuits.get(k) ?? 0) + 1); });
  if (ui.pursuit && !pursuits.has(ui.pursuit)) ui.pursuit = null;
  const rank = (t) => [t.status === 'done' || t.status === 'dropped' ? 1 : 0, t.overdue ? 0 : 1, dueIn(t.due) ?? 999];
  const cmp = (a, b) => { const x = rank(a), y = rank(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
  let list = byB[ui.bucket].filter(t => ui.bucket === 'unfiled' || !ui.pursuit || pursuitOf(t) === ui.pursuit).sort(cmp);
  const capOn = ui.bucket === 'now' && !ui.showAll && !ui.pursuit && list.length > NOW_CAP; const hidden = capOn ? list.length - NOW_CAP : 0;
  if (capOn) list = list.slice(0, NOW_CAP);
  const segs = [['now', 'Now'], ['later', 'Later'], ['unfiled', 'Unfiled']].map(([k, l]) => `<button type="button" data-bucket="${k}" aria-pressed="${ui.bucket === k}">${l}<span class="num">${byB[k].length}</span></button>`).join('');
  const chips = ui.bucket === 'unfiled' ? '' : `<div class="chips" role="group" aria-label="Pursuit" style="margin-bottom:6px"><button class="chip" type="button" data-pf="" aria-pressed="${!ui.pursuit}">All</button>` +
    [...pursuits.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => `<button class="chip" type="button" data-pf="${esc(k)}" aria-pressed="${ui.pursuit === k}">${esc(k)} <span class="num">${n}</span></button>`).join('') + '</div>';
  const emptyMsg = { now: 'Nothing urgent. Look in Later.', later: 'Nothing parked for later.', unfiled: 'Every task has a home.' }[ui.bucket];
  const footTxt = { now: 'Now = overdue, due within 2 days, or a task you sized at 10 minutes or less.', later: 'Everything with a pursuit that is not urgent yet.', unfiled: 'Tasks with no pursuit or box. File them in a check-in.' }[ui.bucket];

  // right rail
  const wk = all.filter(t => t.status !== 'done' && t.status !== 'dropped' && dueIn(t.due) != null && dueIn(t.due) >= 0 && dueIn(t.due) <= 7).map(t => ({ what: t.action, due: t.due, kind: pursuitOf(t), box: boxKey(t.goal_id) }));
  (S.work ?? []).filter(p => p.deadline && dueIn(p.deadline) != null && dueIn(p.deadline) >= 0 && dueIn(p.deadline) <= 7).forEach(p => wk.push({ what: p.title + ' deadline', due: p.deadline, kind: 'pursuit', box: boxKey(p.goal_id) }));
  wk.sort((a, b) => dueIn(a.due) - dueIn(b.due));
  const weekHtml = wk.slice(0, 7).map(x => `<div class="lrow"><span class="swatch" style="background:${boxColor(x.box)};width:6px;height:6px;align-self:center"></span><span style="flex:1;min-width:0">${esc(x.what)}</span><span class="mono muted" style="font-size:12px;white-space:nowrap">${esc(whenOf({ due: x.due }).txt)}</span></div>`).join('') || '<div class="empty">No deadlines in the next 7 days.</div>';
  const meet = meetingToday(c);
  const meetHtml = meet.map(p => `<button class="lrow click" type="button" ${p.id ? `data-goperson="${esc(p.id)}"` : ''}><b style="font-weight:500;flex:1;min-width:0">${esc(p.name)}</b><span class="muted" style="font-size:12.5px;white-space:nowrap">${esc(p.event)} · ${tme(p.at)}</span></button>`).join('') || `<div class="empty">${S.net ? 'No one you know is on today\'s calendar.' : 'Matching people to events…'}</div>`;
  const cold = S.net ? S.net.nodes.filter(n => (daysAgo(n.last) ?? -1) > 30).sort((a, b) => new Date(a.last) - new Date(b.last)).slice(0, 4) : [];
  const orgName = (id) => S.net?.orgs.find(o => o.id === id)?.name ?? '';
  const coldHtml = S.net ? (cold.map(n => `<button class="lrow click" type="button" data-goperson="${esc(n.id)}"><b style="font-weight:500;flex:1;min-width:0">${esc(n.name)}</b><span class="muted" style="font-size:12.5px;white-space:nowrap">${esc(orgName(n.org))} · ${esc(shortAgo(n.last))}</span></button>`).join('') || '<div class="empty">Nobody has gone quiet for 30+ days.</div>') : '<div class="empty">Loading your network…</div>';
  const owed = c.owed_to_me.map(o => `<div class="lrow"><span style="flex:1"><b style="font-weight:500">${esc(o.owner_name ?? o.owner)}</b> · ${esc(o.action)}</span>${o.due ? `<span class="muted" style="font-size:12.5px;white-space:nowrap">${esc(shortDate(o.due))}</span>` : ''}</div>`).join('') || '<div class="empty">Nobody owes you anything right now.</div>';
  const yes = outboxHtml(c);

  return `<div class="page">
    <div class="goalband"><span class="kicker">Center goal</span><span class="g">${esc(S.goals?.center ?? 'No center goal yet')}</span><span class="spacer"></span><a class="sub" href="#goals">Goals</a></div>
    ${modeBand(c, items)}
    <section class="top" aria-label="Now and Big 3">${heroHtml(c, items)}
      <div class="card"><div class="chead"><h2 class="h">Big 3</h2>${c.big3.length ? `<span class="sub">${doneN} of ${c.big3.length} done</span>` : ''}</div>${b3}${c.big3.length && doneN === c.big3.length ? '<div class="daydone">Day complete. All three done.</div>' : ''}</div>
    </section>
    <section class="card" aria-label="Today's schedule"><div class="chead"><h2 class="h">${c.mode.rolled_to_tomorrow ? "Tomorrow's schedule" : "Today's schedule"}</h2><span class="sub">${nEv} event${nEv === 1 ? '' : 's'}${nBl ? ` · ${nBl} planned` : ''} · ${fmtMin(tl.free)} free 8–22</span><span class="spacer"></span><a class="sub" href="#plan">Plan the week</a></div>
      ${items.length ? tl.html : '<div class="empty">Nothing on the calendar.</div>'}</section>
    <div class="row2">
      <section class="card grow" aria-label="Tasks" style="display:flex;flex-direction:column">
        <div class="chead" style="align-items:center;gap:14px"><h2 class="h">Tasks</h2><div class="seg" role="group" aria-label="Bucket">${segs}</div><span class="spacer"></span>${c.overdue_count ? `<span class="flag" style="font-size:13px">${c.overdue_count} overdue</span>` : ''}</div>
        ${chips}
        <div class="tasklist">${list.map(t => taskRow(t, big3ids)).join('') || `<div class="empty">${emptyMsg}</div>`}</div>
        <div class="tfoot"><span>${footTxt}</span><span class="spacer"></span>${hidden ? `<button class="linkbtn" type="button" data-more="1">Show ${hidden} more</button>` : ui.showAll && ui.bucket === 'now' ? '<button class="linkbtn" type="button" data-more="0">Show fewer</button>' : ''}</div>
      </section>

        <section class="card" aria-label="This week"><div class="chead"><h2 class="h sm">This week</h2><span class="sub">deadlines</span></div>${weekHtml}</section>
        <section class="card" aria-label="People you are meeting"><div class="chead"><h2 class="h sm">Meeting today</h2></div>${meetHtml}</section>

}

// ── Goals (mandala, week by box, mirror) ───────────────────────────────────────────────────────────

  const week = [...Array(7)].map((_, i) => addDays(wkStart, i)); const dow = Math.max(1, week.indexOf(today) + 1 || 7);
  const byBox = new Map(g.boxes.map(b => [b.box, b]));
  const ordered = BOX_ORDER.map(k => byBox.get(k)).filter(Boolean).concat(g.boxes.filter(b => !BOX_ORDER.includes(b.box)));
  const cellFor = (b) => { if (!b) return '<div class="mcell" style="opacity:.4"></div>';
    const t = b.targets?.[0];
    return `<div class="mcell"><i class="glow" style="background:${boxColor(b.box)}"></i><b><span class="swatch" style="background:${boxColor(b.box)}"></span>${esc(b.title)}</b><div class="tr">${esc(b.tracker ?? 'Tracker not set')}</div>
      <div class="st">${t ? `${esc(t.action)} <span class="mono">${t.done}/${t.target}</span><div class="meter"><i style="width:${Math.min(100, Math.round(100 * t.done / Math.max(1, t.target)))}%;background:${boxColor(b.box)};color:${boxColor(b.box)}"></i></div>` : `${b.done_week} done · ${b.open} open this week`}</div></div>`; };
  const cells = [ordered[0], ordered[1], ordered[2], ordered[3], 'C', ordered[4], ordered[5], ordered[6], ordered[7]].map(x => x === 'C'
    ? `<div class="mcell center"><span class="kicker">Center goal</span><div class="cg">${esc(g.center ?? 'No center goal yet')}</div></div>` : cellFor(x)).join('');

  const rows = ordered.map(b => {
    const t = b.targets?.[0];
    let target = '<span class="muted" style="font-size:12.5px">Activity only · no weekly target</span>', dots = '<span class="muted" style="font-size:12px">–</span>', verdict = '<span class="verdict none">no target</span>';
    if (t) {
      const pct = Math.min(100, Math.round(100 * t.done / Math.max(1, t.target))); const pace = t.target * dow / 7;
      const v = t.done >= t.target ? ['on', 'done'] : t.done >= pace * 0.75 ? ['on', 'on pace'] : ['behind', 'behind'];
      target = `<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px"><span>${esc(t.action)}</span><span class="mono">${t.done}/${t.target} ${esc(t.unit ?? '')}</span></div><div class="meter"><i style="width:${pct}%;background:${boxColor(b.box)};color:${boxColor(b.box)}"></i></div></div>`;
      const byDay = new Map((t.days ?? []).map(d => [String(d.day).slice(0, 10), d]));
      dots = `<div class="dots" aria-label="Sessions by day">${week.map(d => { const x = byDay.get(d); const n = x?.sessions ?? 0;
        return `<span class="${n ? 'on' : ''} ${d === today ? 'today' : ''}" style="${n ? `background:${boxColor(b.box)}` : ''}" title="${esc(dayName(d))}: ${n} ${x ? (x.source === 'reported' ? '(you said)' : '(calendar)') : ''}">${n > 1 ? n : new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'narrow', timeZone: 'UTC' })}</span>`; }).join('')}</div>`;
      verdict = `<span class="verdict ${v[0]}">${v[1]}</span>`;
    }
    return `<div class="wrow"><div><div class="gt"><span class="swatch" style="background:${boxColor(b.box)}"></span>${esc(b.title)}</div><div class="tr">Tracker: ${esc(b.tracker ?? 'not set')}</div></div>
      ${target}${dots}<div class="gk"><b>${b.done_week}</b><span>done</span></div><div class="gk"><b>${b.open}</b><span>open</span></div><div class="gk"><b>${b.hours_week}</b><span>hours</span></div>${verdict}</div>`;
  }).join('');

  const r = S.review; let mirror;
  if (!r) mirror = `<div class="empty">${S.err.review ? esc(errText(S.err.review)) : 'Loading the month…'}</div>`;
  else {
    const p = r.promises; const kept = p.kept + p.dropped ? Math.round(100 * p.kept / (p.kept + p.dropped)) : null;
    const month = new Date(r.month + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const rb = new Map(r.boxes.map(b => [b.box, b]));
    mirror = `<div class="chead" style="align-items:center"><h3 class="h sm" style="margin:0">Promises in ${esc(month)}</h3><span class="spacer"></span>
        <button class="btn" type="button" data-month="-1" aria-label="Previous month">‹</button><button class="btn" type="button" data-month="0">This month</button><button class="btn" type="button" data-month="1" aria-label="Next month">›</button></div>
      <div class="stats"><div><b>${p.kept}</b><span>kept</span></div><div><b>${p.dropped}</b><span>dropped</span></div><div><b>${p.late}</b><span>done late</span></div><div><b style="color:${p.open_overdue ? 'var(--warn)' : 'var(--good)'}">${p.open_overdue}</b><span>overdue now</span></div>${kept != null ? `<div><b>${kept}%</b><span>kept of closed</span></div>` : ''}<div><b>${p.late_exact ?? '–'}</b><span>late since 17 Nov (exact)</span></div></div>
      ${r.approximate_note ? `<p class="pickhint" style="margin:14px 0 0">${esc(r.approximate_note)}</p>` : ''}
      <div class="mgrid" style="margin-top:16px">${ordered.map(b => { const m = rb.get(b.box); const t = m?.targets?.[0];
        return `<div class="mbox"><b style="display:flex;gap:8px;align-items:center;font-weight:600"><span class="swatch" style="background:${boxColor(b.box)}"></span>${esc(b.title)}</b>
          <div style="font-size:13px;margin-top:4px">${m ? `<span class="mono">${m.done_month ?? m.done}</span> done this month · ${m.open} open · ${m.hours} h` : '<span class="muted">No data</span>'}</div>
          <div class="muted" style="font-size:12px;margin-top:2px">${t ? `${esc(t.action)}: target ${t.weekly_target}/wk, judged weekly above` : 'Activity only'}</div></div>`; }).join('')}</div>
      <p class="muted" style="margin:14px 0 0;font-size:12.5px">The mirror reads only what the brain recorded. <a href="#mirror">Open the full Mirror review</a> for verdicts, questions and goal decisions.</p>`;
  }
  return `<div class="page">
    <h1 class="h1">Goals</h1>
    <section class="mandala" aria-label="Mandala: center goal and eight boxes">${cells}</section>
    <section class="card" aria-label="This week, by box"><div class="chead"><h2 class="h">This week, by box</h2><span class="sub">Dots are sessions per day. Pace compares progress with how far into the week it is.</span></div>

      <p class="muted" style="margin:10px 0 0;font-size:12.5px">Only boxes with a weekly target get a pace. Set one in a check-in ("gym 3 a week").</p></section>
    <section class="card" id="mirror" aria-label="Mirror"><div class="kicker" style="margin-bottom:8px">Mirror</div>${mirror}</section>
  </div>`;
}

// ── Work ───────────────────────────────────────────────────────────────────────────────────────────
function renderWork() {
  const w = S.work; if (!w) return S.err.work ? notice(S.err.work) : loading();
  const byParent = new Map(); for (const p of w) { const k = p.parent_id ?? ''; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(p); }
  const firms = w.filter(p => p.kind === 'firm' && (p.status === 'active' || p.status === 'paused' || p.stage === 'closed'));
  const recruiting = w.find(p => p.id === 'recruiting');
  const open = (p) => (S.control?.tasks ?? []).filter(t => t.pursuit === p.title && t.status !== 'done' && t.status !== 'dropped');
  const deadlines = firms.filter(f => f.stage !== 'closed' && f.deadline && dueIn(f.deadline) != null && dueIn(f.deadline) >= 0 && dueIn(f.deadline) <= 21).length;
  const card = (p) => { const nm = p.next_move; const nw = nm ? whenOf(nm) : null; const ts = open(p).filter(t => !nm || t.id !== nm.id);
    return `<div class="fcard" draggable="true" data-firm="${esc(p.id)}">
      <div class="ft"><span>${esc(p.title)}</span>${p.deadline ? `<span class="dl">${esc(shortDate(p.deadline))}</span>` : ''}</div>
      ${nm ? `<div class="nx"><span class="muted">Next:</span> ${esc(nm.action)}${nw.txt ? ` <span class="${nw.late ? 'flag' : 'muted'}" style="font-size:12px">· ${esc(nw.txt)}</span>` : ''}</div>` : '<div class="nx muted">No next move</div>'}
      ${ts.length ? `<div>${ts.slice(0, 3).map(miniTask).join('')}${ts.length > 3 ? `<div class="muted" style="font-size:12px">+${ts.length - 3} more open</div>` : ''}</div>` : ''}
      ${p.ask_close ? '<div class="flag" style="font-size:12px">Quiet 14+ days · close it?</div>' : ''}
      <div class="fm">${p.people.length ? `<button class="linkbtn" type="button" data-org-of="${esc(p.id)}" style="font-size:12px">${p.people.length} ${p.people.length === 1 ? 'person' : 'people'}</button>` : '<span>no contacts</span>'}<span>· ${shortAgo(p.last_activity)}</span><span class="spacer"></span>
        <select data-stage="${esc(p.id)}" aria-label="Stage for ${esc(p.title)}">${STAGES.map(s => `<option ${s === p.stage ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>`; };
  const cols = STAGES.map(s => { const cs = firms.filter(f => (f.stage ?? 'researching') === s);
    return `<div class="col ${cs.length ? '' : 'zero'} ${s === 'closed' ? 'closed' : ''}" data-col="${s}"><div class="ch">${esc(cap(s))}<span class="num muted" style="font-weight:400">${cs.length}</span></div>${cs.map(card).join('') || '<div class="drop">Drop a firm here</div>'}</div>`; }).join('');
  const prow = (p, child) => { const ts = open(p);
    return `<div class="prow ${child ? 'child' : ''}"><div class="top1"><span class="swatch" style="width:10px;height:10px;background:${boxColor(boxKey(p.goal_id))}"></span><b>${esc(p.title)}</b>
      ${p.deadline ? `<span class="dl">${esc(shortDate(p.deadline))}</span>` : ''}${p.ask_close ? '<span class="flag" style="font-size:12px">quiet 14+ days: close it?</span>' : ''}
      <span class="spacer"></span><span class="sm">last activity ${esc(ago(p.last_activity))}</span><span class="mono sm">${p.open_moves ?? ts.length} open</span></div>
      <div class="sm" style="padding-left:20px">${p.summary ? esc(p.summary) : 'No summary yet. The next compile run writes one.'}${p.next_move ? ` <span style="color:var(--ink)">Next: ${esc(p.next_move.action)}</span>` : ''}</div>
      ${ts.length ? `<div class="tasks">${ts.slice(0, 5).map(miniTask).join('')}${ts.length > 5 ? `<div class="muted" style="font-size:12px">+${ts.length - 5} more</div>` : ''}</div>` : ''}</div>`; };
  const tree = (pid, depth) => (byParent.get(pid) ?? []).filter(p => p.status === 'active' || p.status === 'paused').map(p => prow(p, depth > 0) + (p.kind === 'area' ? '' : tree(p.id, depth + 1))).join('');
  const streams = (byParent.get('recruiting') ?? []).filter(p => p.kind !== 'firm' && (p.status === 'active' || p.status === 'paused'));
  return `<div class="page">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><h1 class="h1">Recruiting</h1><span class="muted">${firms.filter(f => f.stage !== 'closed').length} active firms${deadlines ? ` · ${deadlines} deadline${deadlines === 1 ? '' : 's'} in the next 3 weeks` : ''}</span></div>
    ${recruiting?.next_move || recruiting?.summary ? `<div class="muted" style="margin-top:-12px">${recruiting.summary ? esc(recruiting.summary) : ''}${recruiting.next_move ? ` <b style="color:var(--ink);font-weight:500">Next: ${esc(recruiting.next_move.action)}</b>` : ''}</div>` : ''}
    <section class="board" aria-label="Pipeline. Drag a firm to another stage, or use its stage menu."><div class="cols">${cols}</div></section>
    <section class="card" aria-label="Workstreams"><h2 class="h" style="margin-bottom:4px">Workstreams</h2>${streams.map(p => prow(p, false) + tree(p.id, 1)).join('') || '<div class="empty">No recruiting workstreams.</div>'}</section>
    <section class="card" aria-label="Other pursuits"><h2 class="h" style="margin-bottom:4px">Other pursuits</h2>${(byParent.get('') ?? []).filter(p => p.id !== 'recruiting' && (p.status === 'active' || p.status === 'paused')).map(p => prow(p, false) + tree(p.id, 1)).join('') || '<div class="empty">None yet.</div>'}</section>
  </div>`;
}

// ── People: a zoomable universe ────────────────────────────────────────────────────────────────────
// Levels: universe > galaxy (life box) > system (organisation) > circles > inner circles … > stars (people).
// Circles come from who-knows-whom links (label propagation), split again until groups are small.
function seededRand(seed) { let s = seed % 2147483647 || 7; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }
function buildUniverse(net, work, goals) {
  const boxTitle = (k) => k === 'other' ? 'Elsewhere' : goals?.boxes.find(b => b.box === k)?.title ?? cap(k);
  const idsOf = (p) => (p.people ?? []).map(x => typeof x === 'object' && x ? (x.id ?? x.entity_id) : x);
  const adj = new Map(); net.links.forEach(l => { if (!adj.has(l.a)) adj.set(l.a, new Set()); if (!adj.has(l.b)) adj.set(l.b, new Set()); adj.get(l.a).add(l.b); adj.get(l.b).add(l.a); });
  const byId = new Map(net.nodes.map(n => [n.id, n]));
  const orgBox = {};
  for (const o of net.orgs) {
    const memb = new Set(net.nodes.filter(n => n.org === o.id).map(n => n.id)); const first = (o.name || '').toLowerCase().split(/\s+/)[0];
    let box = null;
    for (const p of work ?? []) { const k = boxKey(p.goal_id); if (!k) continue; if (idsOf(p).some(id => memb.has(id)) || (first.length > 2 && String(p.title).toLowerCase().includes(first))) { box = k; break; } }
    orgBox[o.id] = BOX_HEX[box] ? box : 'other';
  }
  const leaf = (id, color, orgId) => { const n = byId.get(id); return { kind: 'person', key: 'p:' + id, id, name: n.name, last: n.last, owe: n.owe, owes: n.owes, deg: n.deg, color, orgId, lr: 7 + Math.sqrt(n.deg) * 2.4 }; };
  let ck = 0;
  const circles = (ids, depth, color, orgId) => {
    if (ids.length <= 5 || depth > 7) return ids.map(id => leaf(id, color, orgId));
    const set = new Set(ids); const nb = (id) => [...(adj.get(id) ?? [])].filter(x => set.has(x));
    const lab = new Map(ids.map(id => [id, id])); const rnd = seededRand(ids.length * 31 + depth);
    const order = [...ids].sort(() => rnd() - 0.5);

        <section class="card"><div class="chead"><h2 class="h sm">Your corrections</h2></div>${t.corrections.map(c => `<div class="lrow" style="display:block"><b style="font-weight:500">${esc(c.title)}</b> <span class="muted">${esc(shortDate(c.at))} · ${esc(c.status)}</span>${c.changed.length ? `<div class="muted" style="font-size:12.5px">${c.changed.map(esc).join('; ')}</div>` : ''}</div>`).join('') || '<div class="empty">No corrections yet.</div>'}</section>

// ── Diary ──────────────────────────────────────────────────────────────────────────────────────────
// Written each night from what he said that day (check-ins, calls, Bee). His edit wins: the nightly run then leaves that day alone.
function monthShift(m, n) { const d = new Date((m ?? ymd(new Date()).slice(0, 7)) + '-01T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); }
function renderDiary() {
  const d = S.diary; if (!d) return S.err.diary ? notice(S.err.diary) : loading();
  const m = d.month; const first = new Date(m + '-01T12:00:00Z'); const lead = (first.getUTCDay() + 6) % 7;
  const nDays = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();

  const waitTxt = d.waiting.length ? `${d.waiting.length} day${d.waiting.length === 1 ? '' : 's'} with new things you said: ${d.waiting.map(w => shortDate(w.day)).join(', ')}. The next compile run writes them (4 a run).` : 'Every day you talked to the brain has an entry.';
  const entry = (e) => {

    return `<article class="card dentry" id="d-${e.day}"><div class="dtop"><span class="dday">${esc(dayName(e.day))}</span>${e.mood ? `<span class="mood">${esc(e.mood)}</span>` : ''}</div>

// ── Mirror ─────────────────────────────────────────────────────────────────────────────────────────
// Monthly review. Verdicts and evidence come from the database (desk_mirror); his answers, goal decisions and
// commitments are saved as he goes; goal changes apply only when he closes the review.
const VERDICT = { on_track: ['on', 'On track'], behind: ['behind', 'Behind'], failing: ['fail', 'Failing'], no_data: ['none', 'No data'] };
function mirrorHeadline(r) {
  const c = { on_track: 0, behind: 0, failing: 0, no_data: 0 }; r.boxes.forEach(b => { c[b.verdict]++; });
  const p = r.promises; const kept = p.kept_on_time + p.kept_late;
  const parts = [`${c.on_track} of ${r.boxes.length} boxes on track`];
  if (c.failing) parts.push(`${c.failing} failing`); if (c.behind) parts.push(`${c.behind} behind`); if (c.no_data) parts.push(`${c.no_data} with no data`);
  return `${parts.join(', ')}. You kept ${kept} promise${kept === 1 ? '' : 's'}${p.kept_late ? ` (${p.kept_late} late)` : ''} and dropped ${p.dropped}.`;
}
function renderMirror() {
  const r = S.mirror; if (!r) return S.err.mirror ? notice(S.err.mirror) : loading();
  const rv = r.review ?? { answers: {}, decisions: {}, commitments: [], closed_at: null }; const closed = !!rv.closed_at;
  const p = r.promises; const total = p.kept_on_time + p.kept_late + p.dropped;
  const rel = total ? Math.round(100 * p.kept_on_time / total) : null;
  const order = (b) => { const i = BOX_ORDER.indexOf(b.box); return i < 0 ? 99 : i; };
  const rank = { failing: 0, behind: 1, no_data: 2, on_track: 3 };
  const boxes = [...r.boxes].sort((a, b) => rank[a.verdict] - rank[b.verdict] || order(a) - order(b));
  const boxCard = (b) => {
    const v = VERDICT[b.verdict]; const ans = rv.answers?.[b.id]?.text ?? ''; const dec = rv.decisions?.[b.id] ?? {};
    const decBtn = (k, label) => `<button type="button" aria-pressed="${dec.decision === k}" data-mdec="${b.id}" data-k="${k}" ${closed ? 'disabled' : ''}>${label}</button>`;
    return `<section class="card" id="m-${esc(b.box)}"><div class="mbx">
      <div><div class="chead" style="margin:0"><span class="swatch" style="background:${boxColor(b.box)}"></span><h2 class="h sm" style="flex:1">${esc(b.title)}</h2><span class="verdict ${v[0]}">${v[1]}</span></div>
        <ul class="ev">${b.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>
        ${b.quote ? `<div class="dquote" style="margin-top:12px">“${esc(b.quote.text)}” <span class="muted" style="font-style:normal;font-size:12px">${esc(shortDate(b.quote.day))}</span></div>` : ''}
        ${b.tracker ? `<div class="sub" style="margin-top:10px">Tracker: ${esc(b.tracker)}</div>` : ''}</div>
      <div><ol class="qs">${b.questions.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
        <textarea id="mans-${esc(b.box)}" data-mans="${b.id}" placeholder="${closed ? 'No answer written.' : 'Answer honestly, in a few lines. Saved when you click away.'}" ${closed ? 'readonly' : ''} aria-label="Your answer for ${esc(b.title)}">${esc(ans)}</textarea>
        <div class="mdec"><span class="sub">This box next month:</span><div class="seg" role="group" aria-label="Decision for ${esc(b.title)}">${decBtn('keep', 'Keep')}${decBtn('rewrite', 'Rewrite')}${decBtn('pause', 'Pause')}${decBtn('drop', 'Drop')}</div><span class="saved" id="msv-${esc(b.box)}"></span></div>
        ${dec.decision === 'rewrite' ? `<div class="mrw"><input id="mrw-${esc(b.box)}" data-mrw="${b.id}" value="${esc(dec.new_title ?? '')}" placeholder="New wording for this box" ${closed ? 'readonly' : ''} aria-label="New wording"></div>` : ''}
      </div></div></section>`;
  };
  const last = r.last_review?.commitments?.length ? `<section class="card"><div class="chead"><h2 class="h sm">You committed to these last month</h2></div>
      <div class="mlist">${r.last_review.commitments.map(c => `<div class="lrow"><span class="mtag ${c.status === 'done' ? '' : c.due && c.due < (S.control?.mode?.day ?? '') ? 'overdue' : ''}">${esc(c.status)}</span><b style="flex:1">${esc(c.action)}</b><span class="mono muted">${esc(shortDate(c.due))}</span></div>`).join('')}</div></section>` : '';
  const list = (arr, empty) => arr.length ? `<div class="mlist">${arr.map(x => `<div class="lrow">${x.kind ? `<span class="mtag ${x.kind}">${esc(x.kind)}</span>` : ''}<span style="flex:1">${esc(x.action)}</span><span class="mono muted">${esc(shortDate(x.due ?? x.at))}</span></div>`).join('')}</div>` : `<div class="empty">${empty}</div>`;
  const boxOpts = boxes.filter(b => b.verdict !== 'no_data' || true).map(b => `<option value="${esc(b.id)}">${esc(String(b.title).split(':')[0])}</option>`).join('');
  return `<div class="page">
    <div class="mhead"><h1 class="h1">Mirror</h1><span class="sub">${esc(r.label)}${r.partial ? ` · so far, through ${esc(shortDate(r.through))}` : ''}${closed ? ` · closed ${esc(shortDate(rv.closed_at))}` : ''}</span><span class="spacer"></span>
      <button class="btn" type="button" data-mmonth="-1" aria-label="Previous month">‹</button><button class="btn" type="button" data-mmonth="0">Review month</button><button class="btn" type="button" data-mmonth="1" aria-label="Next month">›</button></div>
    <p class="mline">${esc(mirrorHeadline(r))}</p>
    ${last}
    <section class="card"><div class="stats"><div><b>${p.kept_on_time}</b><span>kept on time</span></div><div><b>${p.kept_late}</b><span>kept late</span></div><div><b>${p.dropped}</b><span>dropped</span></div>
      <div><b style="color:${p.overdue_now ? 'var(--warn)' : 'var(--good)'}">${p.overdue_now}</b><span>overdue now (target 0)</span></div><div><b>${rel == null ? '–' : rel + '%'}</b><span>reliability</span></div>
      <div><b>${p.owed_to_others_done}/${p.owed_to_others_done + p.owed_to_others_open}</b><span>promises to others kept</span></div><div><b>${r.diary_days}</b><span>diary days</span></div></div>
      ${r.approximate_note ? `<p class="pickhint" style="margin:14px 0 0">${esc(r.approximate_note)}</p>` : ''}</section>
    ${boxes.map(boxCard).join('')}
    <div class="row2">
      <section class="card grow" style="flex-basis:420px"><div class="chead"><h2 class="h sm">What went well</h2></div>${list(r.went_well, 'Nothing was marked done this month.')}</section>
      <section class="card grow" style="flex-basis:420px"><div class="chead"><h2 class="h sm">What went wrong</h2></div>${list(r.went_wrong, 'Nothing dropped, late or overdue.')}</section>
    </div>
    <section class="card"><div class="chead"><h2 class="h sm">Commitments for next month</h2><span class="sub">Dated, specific, and they open next month's review. Each one also becomes a task.</span></div>
      ${list((rv.commitments ?? []).map(c => ({ action: c.action, due: c.due })), 'None yet.')}
      ${closed ? '' : `<div class="mform" style="margin-top:12px"><input id="mcTitle" placeholder="I will…" aria-label="Commitment"><input id="mcDue" type="date" aria-label="By when"><select id="mcBox" aria-label="Box"><option value="">No box</option>${boxOpts}</select><button class="btn primary" type="button" data-mcommit="1">Add</button></div>`}</section>
    ${closed ? '' : `<section class="card mclose"><div style="flex:1;min-width:240px"><b style="font-family:var(--f-head)">Close the review</b><div class="sub">Applies your rewrite, pause and drop decisions to the goals and saves the review to your memory and diary.</div></div>
      ${S.mirrorConfirm ? `<button class="btn" type="button" data-mclose="cancel">Not yet</button><button class="btn primary" type="button" data-mclose="go" ${S.mirrorBusy ? 'disabled' : ''}>Yes, close ${esc(r.label)}</button>` : `<button class="btn primary" type="button" data-mclose="ask">Close review</button>`}</section>`}
  </div>`;
}
function mflash(box, msg) { const el = document.getElementById('msv-' + box); if (el) { el.textContent = msg; setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500); } }
const boxOfId = (id) => S.mirror?.boxes.find(b => b.id === id)?.box ?? '';
async function mirrorSaveAnswer(el) {
  const id = el.dataset.mans; const text = el.value; const rv = (S.mirror.review ??= { answers: {}, decisions: {}, commitments: [], closed_at: null });
  if ((rv.answers?.[id]?.text ?? '') === text.trim()) return;
  rv.answers = { ...(rv.answers ?? {}), [id]: { text: text.trim() } };
  try { await act('mirror_answer', { month: S.mirror.month, box: id, answer: text }); mflash(boxOfId(id), 'Saved'); }
  catch (e) { needsUpdate('Saving review answers')(e); }
}
async function mirrorDecide(id, k, newTitle) {
  const rv = (S.mirror.review ??= { answers: {}, decisions: {}, commitments: [], closed_at: null });
  const cur = rv.decisions?.[id]?.decision;
  if (k === 'rewrite' && newTitle == null) { rv.decisions = { ...(rv.decisions ?? {}), [id]: { decision: 'rewrite', new_title: rv.decisions?.[id]?.new_title ?? '' } }; render(); document.getElementById('mrw-' + boxOfId(id))?.focus(); return; }
  const to = cur === k && k !== 'rewrite' ? 'undecided' : k;
  const before = rv.decisions?.[id];

  catch (e) { if (before) rv.decisions[id] = before; else delete rv.decisions[id]; render(); needsUpdate('Saving decisions')(e); }
}
async function mirrorCommit() {

document.addEventListener('focusout', (e) => {

});
document.addEventListener('keydown', (e) => { if (e.target.dataset?.mrw != null && e.key === 'Enter' && e.target.value.trim()) e.target.blur(); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-mmonth],[data-mdec],[data-mcommit],[data-mclose]'); if (!t) return;
  if (t.dataset.mmonth != null) { const n = +t.dataset.mmonth; if (n === 0) S.mirrorMonth = null; else { const d = new Date((S.mirror?.month ?? ymd(new Date())).slice(0, 7) + '-01T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); S.mirrorMonth = d.toISOString().slice(0, 7); } S.mirror = null; render(); return load('mirror'); }

// ── Control room: time-of-day band, outbox, night clock, why sheet ─────────────────────────────────
function modeBand(c, items) {
  const m = c.mode.mode; const b3 = c.big3; const left = b3.filter(b => b.status !== 'done'); const firstOpen = left[0];
  const nowNext = items.find(i => new Date(i.end ?? i.start) > Date.now());
  if (b3.length && !left.length) return `<div class="modeband done" role="status"><span class="mk">Day complete</span><span class="mt">All three done. That is the day.</span><a class="sub" href="#diary">Diary</a></div>`;
  if (m === 'morning') return b3.length
    ? `<div class="modeband morning"><span class="mk">Morning</span><span class="mt">Big 3 set. Start with: ${esc(firstOpen?.action ?? b3[0].action)}</span></div>`
    : `<div class="modeband morning"><span class="mk">Morning</span><span class="mt">Pick your Big 3: star three tasks below, or name them in your morning check-in.</span></div>`;
  if (m === 'evening') return `<div class="modeband"><span class="mk">Evening</span><span class="mt">${b3.length ? `${left.length} of your Big 3 still open.` : 'No Big 3 today.'} Close the day with your evening check-in in Claude.</span><a class="sub" href="#diary">Diary</a></div>`;
  if (m === 'night') return `<div class="modeband"><span class="mk">Night</span><span class="mt">${nowNext ? `Tomorrow starts with ${esc(nowNext.title)} at ${tme(nowNext.start)}.` : 'Nothing on the calendar tomorrow morning.'}</span><button class="btn" type="button" data-night="on">Night clock</button></div>`;
  return `<div class="modeband"><span class="mk">Focus</span><span class="mt">${firstOpen ? `Next on your Big 3: ${esc(firstOpen.action)}` : 'No Big 3 yet. Star up to three tasks.'}</span></div>`;
}
function nightClock(c, items) {

  $('#main').innerHTML = `<form class="notice" id="setupForm" style="display:grid;gap:10px">
    <b>Connect this desk to your brain</b><span>${esc(msg)}</span>
    <input id="tok" type="password" autocomplete="off" placeholder="Connector token, or the whole connector URL" style="padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:transparent">
    <div><button class="btn primary" type="submit">Connect</button></div>
    <span class="muted" style="font-size:12.5px">Kept only in this browser. It is the same token as the Second Brain connector (the part after the last / of its URL).</span></form>`;
  $('#setupForm').onsubmit = async (e) => { e.preventDefault(); TOKEN = cleanToken($('#tok').value); store.set('brain_token', TOKEN); await start(); };
}
async function start() {
  try { if (!MCP) await direct('GET', { view: 'health' }); }
  catch (e) { if (e.code === 'bad_token' || e.code === 'no_token') return setup(e.code === 'bad_token' ? 'That token was not accepted. Paste it again.' : 'Paste the brain connector token once. After that the desk loads by itself and refreshes every minute.'); }
  await load();
  if (screen() !== 'today') load('today', true);
}
$('#tokenBtn').onclick = () => { store.set('brain_token', ''); TOKEN = ''; setup('Enter the brain connector token.'); };
(async function boot() {
  try { MCP = window.claude?.use ? await window.claude.use('mcp') : null; } catch { MCP = null; }
  if (!MCP) $('#tokenBtn').hidden = false;
  await start();
})();
</script>

</body>
</html>
